name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run the (stub) deploy job. Disabled until you fill in the placeholders below."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # kalshi/config.py raises at import if these are missing. Dummy values only;
      # no test talks to Kalshi.
      API_KEY_ID: ci-dummy
      PRIVATE_KEY_PATH: /tmp/ci-dummy.pem
      KALSHI_ENV: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dashboard.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dashboard.txt
      - name: Run tests
        run: python -m pytest -q

  # The dashboard is deployed from requirements-frontend.txt alone (no trading dependencies). Prove it
  # imports and its pure logic passes with ONLY those packages, with no Kalshi credentials in the
  # environment at all. This job can fail: a missing frontend dependency breaks the build here.
  frontend-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-frontend.txt
      - name: Install ONLY the frontend requirements (plus pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-frontend.txt pytest
      - name: Frontend modules import without any trading dependency or Kalshi credential
        env:
          DASHBOARD_MODE: remote
          DASHBOARD_PASSWORD: ci-dummy
        run: |
          env | grep -E '^(API_KEY_ID|PRIVATE_KEY_PATH)=' && { echo "credentials leaked into the job"; exit 1; } || true
          python -c "import nba_trading.dashboard.data, nba_trading.dashboard.freshness, nba_trading.dashboard.auth, nba_trading.dashboard.remote, nba_trading.control, nba_trading.replication.subscriber; print('frontend imports ok')"
          python - <<'PY'
          import sys
          import nba_trading.dashboard.remote, nba_trading.control, nba_trading.replication.subscriber  # noqa: F401
          bad = [m for m in sys.modules if m.split('.')[0] in ('kalshi', 'apscheduler', 'agent_trader') or m == 'nba_trading.main']
          assert not bad, f"trading code imported by the frontend: {bad}"
          print('no trading modules loaded')
          PY
      - name: Frontend logic tests (pure functions; no trading dependencies)
        run: python -m pytest -q nba_trading/tests/test_freshness.py

  # The backend image installs requirements-backend.txt alone. Prove the bot and replicator import and start
  # their pure paths with ONLY those packages, so a missing runtime dependency fails here and not on the server.
  backend-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_KEY_ID: ci-dummy
      PRIVATE_KEY_PATH: /tmp/ci-dummy.pem
      KALSHI_ENV: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-backend.txt
      - name: Install ONLY the backend runtime requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt
      - name: Bot, replicator, control CLI and restore import (this step can fail)
        run: |
          python -c "import nba_trading.main, nba_trading.replication.publisher, nba_trading.replication.restore, nba_trading.control; print('backend imports ok')"
          python -c "import sys; assert 'streamlit' not in sys.modules; import importlib.util as u; assert not u.find_spec('streamlit')"

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (smoke test, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kalshi-trader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image contains no secrets or state
        run: |
          docker run --rm --entrypoint sh kalshi-trader:ci -c \
            '! ls /app/.env /app/data/* /app/*.pem /app/*.sqlite* 2>/dev/null | grep -q .'
      - name: Backend imports resolve, and the dashboard is NOT in the backend image
        run: |
          docker run --rm --entrypoint python \
            -e API_KEY_ID=ci -e PRIVATE_KEY_PATH=/tmp/x.pem \
            kalshi-trader:ci -c "import nba_trading.main, nba_trading.replication.publisher, nba_trading.control; print('ok')"
          ! docker run --rm --entrypoint python kalshi-trader:ci -c "import streamlit" 2>/dev/null
      - name: Build the frontend image (smoke test, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          load: true
          tags: kalshi-frontend:ci
      - name: Frontend image has no secrets and its modules import (this step can fail)
        run: |
          docker run --rm --entrypoint sh kalshi-frontend:ci -c \
            '! ls /app/.env /app/*.pem /app/data/* 2>/dev/null | grep -q .'
          docker run --rm --entrypoint python \
            -e DASHBOARD_MODE=remote -e DASHBOARD_PASSWORD=ci \
            kalshi-frontend:ci -c "import nba_trading.dashboard.freshness, nba_trading.dashboard.auth, nba_trading.dashboard.remote, nba_trading.dashboard.data; print('ok')"
      - name: Compose file validates
        env:
          REPLICATION_BUCKET: ci
          CONTROL_BUCKET: ci
          REPLICATION_ACCESS_KEY_ID: ci
          REPLICATION_SECRET_ACCESS_KEY: ci
          LITESTREAM_BUCKET: ci
          LITESTREAM_ACCESS_KEY_ID: ci
          LITESTREAM_SECRET_ACCESS_KEY: ci
        run: |
          touch .env   # env_file must exist; empty is fine for validation
          docker compose config -q
          docker compose --profile local-dashboard --profile litestream config -q

  # ---------------------------------------------------------------------------
  # DEPLOY STUB: intentionally disabled (`if: false`). It never runs on push/PR.
  # To enable: remove `if: false` (or change it to `inputs.deploy`), add the
  # repository secrets below, and keep it manual (workflow_dispatch only).
  # Trading code gating real money should be deployed deliberately, so there is
  # no auto-deploy on push. Never put the Kalshi key or .env in GitHub secrets;
  # they live only on the server (see docs/deployment.md).
  #
  # Needed repo secrets (placeholders):
  #   DEPLOY_HOST      e.g. 203.0.113.10 or a Tailscale name
  #   DEPLOY_USER      e.g. deploy
  #   DEPLOY_SSH_KEY   private key of a deploy-only SSH key
  # ---------------------------------------------------------------------------
  deploy:
    if: false   # replace with: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    environment: production   # add required reviewers on this environment
    steps:
      - name: Deploy over SSH (placeholder)
        run: |
          echo "Example only. Fill in and enable deliberately."
          # install -m 600 /dev/null key && echo "${{ secrets.DEPLOY_SSH_KEY }}" > key
          # ssh -i key -o StrictHostKeyChecking=accept-new \
          #   "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
          #   'cd ~/Kalshi-Trader && git fetch && git checkout ${{ github.sha }} \
          #    && IMAGE_TAG=${{ github.sha }} docker compose up -d --build'
